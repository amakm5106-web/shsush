const SYMBOLS=['sushi','maki','cat','fan','coin','drum','a','k','q','j','10','wild','scatter'];
const BET_STEPS=[20,50,100,300,500,1000,3000,5000],LEGACY_STEPS=[10,40,80,160,320];
let balance=0,bet=20,free=0,freeBet=20,multi=1,auto=0,busy=false,sound=true,turbo=false,grid=[],currentWin=0,lastWin=0,modalToken=0;
let pendingRequest=null,sessionReady=false,pendingBonusId='',bonusPresentationBusy=false;
try{const saved=JSON.parse(sessionStorage.getItem('sakura_pending_spin')||'null');pendingRequest=saved&&typeof saved.requestId==='string'&&/^[0-9a-f-]{36}$/i.test(saved.requestId)&&[...BET_STEPS,...LEGACY_STEPS].includes(saved.stake)?saved:null}catch{pendingRequest=null}
const fmt=v=>`${Math.round(Number(v)||0).toLocaleString('en-US')} MMK`;
const board=$('#board');
for(let i=0;i<30;i++){let c=document.createElement('div');c.className='cell';c.innerHTML='<div class="symbol"></div>';board.append(c)}
const cells=[...board.children],mini=[...document.querySelectorAll('.mini-tile')];
function paint(indices){for(const i of indices||Array.from({length:30},(_,i)=>i)){cells[i].firstChild.dataset.s=grid[i];cells[i].dataset.t=grid[i];cells[i].setAttribute('aria-label',grid[i])}}
function text(s){$('#message').textContent=s}
function controls(){
const can=sessionReady&&!busy&&!pendingBonusId;
$('#balance').textContent=fmt(balance);$('#bet').textContent=fmt(free>0?freeBet:bet);$('#win').textContent=fmt(currentWin);$('#bar-win').textContent=fmt(currentWin);$('#multi').textContent='×'+multi;$('#free-count').textContent=`FREE SPINS: ${free}`;
$('#spin').disabled=!can||(!pendingRequest&&free<=0&&balance<bet);$('#spin').setAttribute('aria-label',pendingRequest?'လက်ရှိလှည့်မှုကို ပြန်လုပ်ရန်':'လှည့်ရန်');$('#minus').disabled=!can||Boolean(pendingRequest)||free>0||bet===BET_STEPS[0];$('#plus').disabled=!can||Boolean(pendingRequest)||free>0||bet===BET_STEPS.at(-1);$('#auto').disabled=!can||Boolean(pendingRequest);$('#auto').classList.toggle('active',auto>0);$('#auto').textContent=auto>0?'Ⅱ':'▷';$('#turbo').textContent=turbo?'⚡ TURBO ON':'⚡ TURBO OFF';$('#turbo').classList.toggle('on',turbo)}
function rand(a,b){return a+Math.random()*(b-a)}
function randomVisualGrid(){return Array.from({length:30},()=>SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)])}
function makeAmbient(){const area=$('#ambient');for(let i=0;i<21;i++){let p=document.createElement('span');p.className='fpetal';p.textContent=i%3?'✿':'🌸';p.style.cssText=`--x:${rand(0,100)}%;--t:${rand(9,22)}s;--d:${-rand(0,20)}s;--dx:${rand(-65,125)}px;--sz:${rand(10,23)}px`;area.append(p)}}
function burstAt(x,y,num=12,colors=['#ffe991','#ffb0e5','#fffef5']){const layer=$('#fx-layer');for(let k=0;k<num;k++){let d=document.createElement('i');d.className='burst';const a=Math.PI*2*k/num+Math.random()*.35,dist=rand(40,126);d.style.cssText=`--sx:${x}px;--sy:${y}px;--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;--c:${colors[k%colors.length]}`;layer.append(d);setTimeout(()=>d.remove(),1250)}}
function fireOnCells(indices){const b=$('#game').getBoundingClientRect();indices.slice(0,25).forEach((i,k)=>{const r=cells[i].getBoundingClientRect();setTimeout(()=>burstAt(r.left-b.left+r.width/2,r.top-b.top+r.height/2,7),k*18)})}
function coinRain(count=32){const layer=$('#fx-layer');for(let i=0;i<count;i++){const d=document.createElement('i');d.className='coinfall';d.textContent='MMK';d.style.cssText=`--x:${rand(0,99)}%;--dur:${rand(1.1,2.7)}s;--delay:${rand(0,1.25)}s`;layer.append(d);setTimeout(()=>d.remove(),4200)}}
function flash(){board.classList.remove('fxflash');void board.offsetWidth;board.classList.add('fxflash');setTimeout(()=>board.classList.remove('fxflash'),720)}
function tinySound(freq=650,t=.13,type='sine',vol=.025){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=window.__sfAudio||(window.__sfAudio=new AC());const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.32,ctx.currentTime+t);g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+t+.008)}catch{}}
function chord(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tinySound(f,.27,'sine',.037),i*100))}
function vibrate(n){try{if(navigator.vibrate)navigator.vibrate(n)}catch{}}
function clearCells(){cells.forEach(c=>{c.classList.remove('rolling','win','vanish','drop','stop');c.style.removeProperty('--delay')})}
function topSpin(){mini.forEach(m=>{m.dataset.s=SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];m.classList.remove('up');void m.offsetWidth;m.classList.add('up')})}
async function playRoll(spinPromise){
 const previousGrid=grid.slice();
 clearCells();
 board.classList.add('is-spinning');
 cells.forEach(c=>c.classList.add('rolling'));
 let spin;
 try{
  const rollTicks=turbo?6:12;
  for(let tick=0;tick<rollTicks;tick++){
   grid=randomVisualGrid();
   paint();
   if(tick%3===0)tinySound(250+tick*19,.06,'triangle',.014);
   await sleep(turbo?48+tick*5:54+tick*7);
  }
  spin=await spinPromise;
 }catch(error){
  board.classList.remove('is-spinning');
  clearCells();
  grid=previousGrid;
  paint();
  throw error;
 }
 const serverGrid=spin.initialGrid;
 grid=serverGrid.slice();
 const stopDelays=turbo?[65,80,100,125,150,190]:[120,165,220,290,380,520];
 for(let col=0;col<6;col++){
  if(col===5&&!turbo)await sleep(260);
  for(let row=0;row<5;row++){
   const i=row*6+col;
   cells[i].classList.remove('rolling');
   cells[i].classList.add('stop');
   paint([i]);
  }
  tinySound(255+col*58,.09,'triangle',.018);
  await sleep(stopDelays[col]);
 }
 board.classList.remove('is-spinning');
 topSpin();
 await sleep(turbo?120:360);
 return spin;
}
async function cascade(indices,serverGrid){fireOnCells(indices);indices.forEach(i=>cells[i].classList.add('vanish'));await sleep(turbo?70:160);grid=serverGrid.slice();for(let row=0;row<5;row++)for(let col=0;col<6;col++)cells[row*6+col].style.setProperty('--delay',(row*28)+'ms');cells.forEach(c=>c.classList.remove('vanish','win','stop','rolling'));paint();cells.forEach(c=>c.classList.add('drop'));await sleep(turbo?110:220);cells.forEach(c=>{c.classList.remove('drop');c.style.removeProperty('--delay')})}
function showToast(s,ms=1500){const t=$('#toast');const id=++modalToken;t.textContent=s;t.classList.add('show');setTimeout(()=>{if(id===modalToken)t.classList.remove('show')},ms)}
async function hugeWin(title,total){return showBigEffect(title,total)}
async function showBigEffect(title,total){const mod=$('#winning-modal'),spot=$('#spotlight');$('#toast').classList.remove('show');const id=++modalToken;$('#modal-title').textContent=title;$('#modal-total').textContent=fmt(0);mod.classList.add('show');spot.classList.add('on');coinRain(54);chord();flash();vibrate([90,45,90]);const start=performance.now(),duration=750;while(performance.now()-start<duration){if(id!==modalToken)break;let p=Math.min(1,(performance.now()-start)/duration);$('#modal-total').textContent=fmt(total*(1-(1-p)**3));await sleep(32)}$('#modal-total').textContent=fmt(total);await sleep(350);if(id===modalToken){mod.classList.remove('show');spot.classList.remove('on')}}
async function loadSession(){
try{
const res=await fetch('/api/sakura/session',{cache:'no-store',credentials:'same-origin'}),data=await res.json();
if(!res.ok||!data.success){sessionReady=false;text(data.code==='UNAUTHENTICATED'?'ကစားရန် အကောင့်ဝင်ပါ။':'Wallet အချက်အလက်ကို မရယူနိုင်ပါ။ ပြန်လည်ကြိုးစားပါ။');controls();return}
balance=Number(data.player.balance)||0;free=Number(data.player.freeSpins)||0;freeBet=Number(data.player.freeSpinStake)||20;if(free>0)bet=freeBet;
const bonus=data.player.pendingBonus;pendingBonusId=bonus&&typeof bonus.id==='string'?bonus.id:'';sessionReady=true;text('');controls();
if(pendingRequest){startSpin();return}if(bonus){presentAndCollectBonus(bonus);return}
}catch(e){sessionReady=false;text('အင်တာနက်/Wallet ချိတ်ဆက်မှု မရနိုင်ပါ။');controls()}}
async function requestSpin(){
if(!pendingRequest){pendingRequest={requestId:crypto.randomUUID(),stake:bet};sessionStorage.setItem('sakura_pending_spin',JSON.stringify(pendingRequest))}
const current=pendingRequest,res=await fetch('/api/sakura/spin',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(current)});let data;
try{data=await res.json()}catch{throw new Error('ROUND_UNCERTAIN')}
if(res.ok&&data.success)return data.spin;
if(data.code==='INSUFFICIENT_FUNDS'){pendingRequest=null;sessionStorage.removeItem('sakura_pending_spin');balance=Number(data.balance)||0;throw new Error('INSUFFICIENT_FUNDS')}
if(['UNAUTHENTICATED','INVALID_BET','INVALID_REQUEST','INVALID_REQUEST_ID'].includes(data.code)){pendingRequest=null;sessionStorage.removeItem('sakura_pending_spin');if(data.code==='UNAUTHENTICATED')sessionReady=false;throw new Error(data.code)}
throw new Error(data.code||'ROUND_UNCERTAIN')}
async function requestBonusCollect(bonusId){let lastError;for(let attempt=0;attempt<2;attempt++){try{const res=await fetch('/api/sakura/collect',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({bonusId})}),data=await res.json();if(res.ok&&data.success)return data;if(data.code==='UNAUTHENTICATED')throw new Error('UNAUTHENTICATED');lastError=new Error(data.code||'COLLECT_FAILED')}catch(error){lastError=error}if(attempt===0)await sleep(250)}throw lastError||new Error('COLLECT_FAILED')}
async function animateBalanceCredit(from,to){const el=$('#balance'),start=performance.now(),duration=800;el.classList.remove('balance-credit');void el.offsetWidth;el.classList.add('balance-credit');while(performance.now()-start<duration){const progress=Math.min(1,(performance.now()-start)/duration);el.textContent=fmt(from+(to-from)*progress);await sleep(24)}el.textContent=fmt(to);setTimeout(()=>el.classList.remove('balance-credit'),700)}
async function presentAndCollectBonus(bonus){if(bonusPresentationBusy||!bonus||!bonus.id)return;bonusPresentationBusy=true;const ownsBusy=!busy;if(ownsBusy)busy=true;pendingBonusId=bonus.id;controls();const amount=Math.max(0,Math.round(Number(bonus.amount)||0)),stake=[...BET_STEPS,...LEGACY_STEPS].includes(Number(bonus.stake))?Number(bonus.stake):20;try{const title=amount>=stake*8?'MEGA WIN!':amount>=stake*3?'BIG WIN!':'FREE SPINS WIN!';if(amount>0)await hugeWin(title,amount);const result=await requestBonusCollect(bonus.id),previous=balance;balance=Number(result.balance)||balance;pendingBonusId='';free=0;controls();coinRain(42);chord();flash();await animateBalanceCredit(previous,balance);text(`🌸 ${fmt(amount)} ကို လက်ကျန်ထဲ ထည့်ပြီးပါပြီ။`)}catch(error){auto=0;sessionReady=false;text('အနိုင်ငွေကို ယခု လက်ခံ၍မရသေးပါ။ စာမျက်နှာကို ပြန်ဖွင့်ပြီး ဆက်လုပ်ပါ။')}finally{bonusPresentationBusy=false;if(ownsBusy)busy=false;controls()}}
async function startSpin(){
if(busy||!sessionReady||pendingBonusId)return;busy=true;$('#spin').classList.add('running');currentWin=0;multi=free>0?2:1;controls();let accepted=false;
try{
text('');const spin=await playRoll(requestSpin());accepted=true;balance=Number(spin.balance)||balance;free=Number(spin.freeSpinsRemaining)||0;freeBet=spin.isFreeSpin?spin.stake:(free>0?spin.stake:freeBet);bet=BET_STEPS.includes(Number(spin.stake))?Number(spin.stake):BET_STEPS[0];multi=spin.isFreeSpin?2:1;lastWin=spin.payout;controls();text('');
if(spin.freeSpinsAwarded>0){showToast(`+${spin.freeSpinsAwarded} FREE SPINS`,1800);coinRain(20);chord();text(`🌸 SCATTER ×${spin.scatterCount} · FREE SPINS +${spin.freeSpinsAwarded}`);await sleep(turbo?100:250)}
for(const step of spin.steps){grid=step.grid.slice();paint();multi=step.multiplier;currentWin+=step.payout;step.winningIndices.forEach(i=>cells[i].classList.add('win'));flash();$('#win-banner').classList.add('flash');controls();text(`✨ WIN +${fmt(step.payout)} · ${step.winningIndices.length} tiles · ×${step.multiplier}`);tinySound(675+step.multiplier*100,.22,'sine',.04);vibrate(30);if(step.multiplier===1)fireOnCells(step.winningIndices.slice(0,7));await sleep(turbo?90:180);$('#win-banner').classList.remove('flash');await cascade(step.winningIndices,step.afterGrid);multi=Math.min(8,step.multiplier+1);$('#multi').classList.remove('bounce');void $('#multi').offsetWidth;$('#multi').classList.add('bounce');controls()}
grid=spin.finalGrid.slice();paint();currentWin=spin.payout;multi=spin.steps.length?Math.min(8,spin.steps.at(-1).multiplier+1):(spin.isFreeSpin?2:1);controls();pendingRequest=null;sessionStorage.removeItem('sakura_pending_spin');
if(spin.isFreeSpin){if(spin.freeSpinFeatureFinished){if(spin.pendingBonusId&&spin.freeSpinWinTotal>0){pendingBonusId=spin.pendingBonusId;await presentAndCollectBonus({id:spin.pendingBonusId,amount:spin.freeSpinWinTotal,stake:spin.stake})}else{text('🌸 အခမဲ့လှည့်ခွင့်အားလုံး ပြီးဆုံးပါပြီ။');showToast('FREE SPINS COMPLETE',1100)}}else{text(`🌸 အခမဲ့လှည့်မှု · စုစုပေါင်း ${fmt(spin.freeSpinWinTotal)}`)}}
else{if(currentWin>=spin.stake*8)await hugeWin('MEGA WIN!',currentWin);else if(currentWin>=spin.stake*3)await hugeWin('BIG WIN!',currentWin);else if(currentWin>0)showToast('NICE WIN! ✦ '+fmt(currentWin),1100);text(currentWin?`🎉 အနိုင်ရငွေ ${fmt(currentWin)}`:spin.freeSpinsAwarded?'🌸 အခမဲ့လှည့်ခွင့် ရရှိပါသည်':'🌸 ဒီတစ်ကြိမ် အနိုင်မရပါ။ နောက်တစ်ကြိမ် ဆက်ကစားနိုင်ပါသည်။')}
}catch(e){console.error(e);auto=0;if(e.message==='INSUFFICIENT_FUNDS')text('Wallet ထဲရှိ MMK မလုံလောက်ပါ။ လောင်းကြေးကို လျှော့ပါ။');else if(e.message==='UNAUTHENTICATED'){text('အကောင့်ဝင်ထားမှု သက်တမ်းကုန်ပါပြီ။ ပြန်ဝင်ပါ။')}else if(e.message==='INVALID_BET'||e.message==='INVALID_REQUEST'||e.message==='INVALID_REQUEST_ID'){text('လောင်းကြေးပမာဏ မမှန်ကန်ပါ။')}else{text('ဒီလှည့်မှုကို မပြီးစီးနိုင်ပါ။ ပြန်ကြိုးစားပါ။')}}
finally{busy=false;$('#spin').classList.remove('running');controls();if(accepted){if(auto>0){auto--;setTimeout(()=>{if(!document.hidden)startSpin();else{auto=0;controls()}},turbo?100:240)}else if(free>0){setTimeout(()=>{if(!document.hidden)startSpin()},turbo?120:260)}}}}
$('#spin').addEventListener('click',startSpin);$('#minus').addEventListener('click',()=>{let i=BET_STEPS.indexOf(bet);bet=BET_STEPS[Math.max(0,i-1)];controls()});$('#plus').addEventListener('click',()=>{let i=BET_STEPS.indexOf(bet);bet=BET_STEPS[Math.min(BET_STEPS.length-1,i+1)];controls()});$('#auto').addEventListener('click',()=>{if(auto){auto=0;controls();return}auto=10;controls();if(!busy)startSpin()});$('#sound').addEventListener('click',()=>{sound=!sound;$('#sound').textContent=sound?'♫':'♪̸';$('#sound').classList.toggle('active',sound);if(sound)tinySound(550)});$('#turbo').addEventListener('click',()=>{turbo=!turbo;controls()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();startSpin()}});document.addEventListener('visibilitychange',()=>{if(document.hidden){auto=0;controls()}});makeAmbient();grid=randomVisualGrid();paint();controls();loadSession();
})();
</script></body></html>
